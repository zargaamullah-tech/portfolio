# Builds the Next.js site and publishes /out to GitHub Pages on every push to main.
#
# One-time setup in GitHub:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# If your repo is named "<your-username>.github.io"  → leave NEXT_PUBLIC_BASE_PATH empty.
# If your repo is named anything else (e.g. "portfolio") → set
#   NEXT_PUBLIC_BASE_PATH: /<repo-name>
# in the env block below so assets resolve under the sub-path.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ⚠️  EDIT THIS LINE if you deploy to a project repo (not <user>.github.io).
      # Example: NEXT_PUBLIC_BASE_PATH: /portfolio
      NEXT_PUBLIC_BASE_PATH: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Disable Jekyll on Pages
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
